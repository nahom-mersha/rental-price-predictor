[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-price-predictor"
version = "0.1.0"
description = "A rental price prediction project that implements linear regression from scratch with NumPy and compares it with scikit-learn models."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]